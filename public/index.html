<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rutinas Gym</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f2330;
    --border: #2a2f3d;
    --text: #e8eaf0;
    --text-dim: #9aa1b2;
    --accent: #6ee7b7;
    --accent-2: #7dd3fc;
    --danger: #f87171;
    --warn: #fbbf24;
    --purple: #c4b5fd;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa;
      --panel: #ffffff;
      --panel-2: #f0f1f6;
      --border: #dde0ea;
      --text: #1a1d29;
      --text-dim: #5b6072;
      --accent: #059669;
      --accent-2: #0284c7;
      --danger: #dc2626;
      --warn: #d97706;
      --purple: #7c3aed;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 3rem;
  }
  header {
    padding: 1.25rem 1rem 0.75rem;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 0.25rem 0 0; color: var(--text-dim); font-size: 0.85rem; }

  nav.tabs {
    max-width: 720px;
    margin: 0.75rem auto 0;
    padding: 0 1rem;
    display: flex;
    gap: 0.4rem;
  }
  nav.tabs button {
    flex: 1;
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  nav.tabs button.active {
    background: var(--accent-2);
    color: #05121c;
    border-color: var(--accent-2);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  .tab-panel { display: none; flex-direction: column; gap: 1rem; }
  .tab-panel.active { display: flex; }

  section.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
  }
  section.card h2 {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  section.card h2 button { font-size: 0.75rem; }

  label { display: block; font-size: 0.8rem; color: var(--text-dim); margin: 0.5rem 0 0.25rem; }
  input, select, textarea {
    width: 100%;
    padding: 0.5rem 0.6rem;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-2); }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 0.55rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--accent-2);
    color: #05121c;
  }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  button.primary { background: var(--accent); color: #05221a; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 100px; }

  .check-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .check-chip {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .check-chip input { width: auto; }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
  }
  .item .meta { font-size: 0.75rem; color: var(--text-dim); display: inline-flex; gap: 0.3rem; margin-top: 0.3rem; }
  .item strong { display: block; font-size: 0.9rem; }

  .fase-row {
    display: grid;
    grid-template-columns: 1.1fr 1.1fr 0.6fr 1fr auto;
    gap: 0.4rem;
    align-items: end;
    margin-bottom: 0.5rem;
  }
  @media (max-width: 560px) {
    .fase-row { grid-template-columns: 1fr 1fr; }
    .fase-row .full { grid-column: 1 / -1; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; }

  .badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .badge-tipo-desayuno, .badge-tiempo-lento { background: color-mix(in srgb, var(--warn) 15%, transparent); border-color: var(--warn); color: var(--warn); }
  .badge-tipo-almuerzo, .badge-tiempo-medio { background: color-mix(in srgb, var(--accent-2) 15%, transparent); border-color: var(--accent-2); color: var(--accent-2); }
  .badge-tipo-cena { background: color-mix(in srgb, var(--purple) 15%, transparent); border-color: var(--purple); color: var(--purple); }
  .badge-tipo-snack, .badge-dificultad-facil, .badge-tiempo-rapido { background: color-mix(in srgb, var(--accent) 15%, transparent); border-color: var(--accent); color: var(--accent); }
  .badge-tipo-merienda { background: color-mix(in srgb, var(--text-dim) 15%, transparent); border-color: var(--text-dim); color: var(--text-dim); }
  .badge-dificultad-media { background: color-mix(in srgb, var(--danger) 15%, transparent); border-color: var(--danger); color: var(--danger); }
  .badge-dificultad-elaborada { background: color-mix(in srgb, var(--purple) 15%, transparent); border-color: var(--purple); color: var(--purple); }

  .item[data-tipo="desayuno"] { border-left: 3px solid var(--warn); }
  .item[data-tipo="almuerzo"] { border-left: 3px solid var(--accent-2); }
  .item[data-tipo="cena"] { border-left: 3px solid var(--purple); }
  .item[data-tipo="snack"] { border-left: 3px solid var(--accent); }
  .item[data-tipo="merienda"] { border-left: 3px solid var(--text-dim); }

  .empty { color: var(--text-dim); font-size: 0.85rem; padding: 0.5rem 0; }

  .dia-block { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.6rem; overflow: hidden; }
  .dia-header {
    background: var(--panel-2);
    padding: 0.5rem 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .dia-header .sesion-nombre { font-weight: 400; color: var(--text-dim); font-size: 0.8rem; }
  .dia-header .sesion-info { display: flex; align-items: center; gap: 0.5rem; }
  .btn-borrar-sesion {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0.1rem 0.3rem;
    font-size: 0.8rem;
  }
  .btn-borrar-sesion:hover { color: var(--danger); }
  .btn-icon {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0.1rem 0.3rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn-icon:hover { color: var(--accent-2); }
  .btn-icon.btn-icon-danger:hover { color: var(--danger); }
  #select-plan-bloque { text-align: center; font-weight: 600; }
  .dia-descanso { padding: 0.5rem 0.75rem; color: var(--text-dim); font-size: 0.8rem; font-style: italic; }
  .dia-block table { margin: 0; }
  .dia-block td, .dia-block th { padding: 0.35rem 0.75rem; vertical-align: top; }
  select.swap-ejercicio { width: auto; min-width: 140px; max-width: 100%; font-size: 0.8rem; padding: 0.3rem 0.4rem; }
  .fase-cell {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-align: center;
    vertical-align: middle;
    color: var(--text-dim);
    background: var(--panel);
    white-space: nowrap;
    border-right: 1px solid var(--border);
  }
  .ej-desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.25rem; line-height: 1.3; max-width: 320px; }

  .objetivos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.75rem; }
  .objetivo-btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.7rem;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    font-weight: 400;
  }
  .objetivo-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .objetivo-emoji { font-size: 1.3rem; }
  .objetivo-label { font-size: 0.85rem; font-weight: 600; }
  .objetivo-sub { font-size: 0.7rem; color: var(--text-dim); }
  .toast {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 0.6rem 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    max-width: 90%;
    display: none;
  }
  .toast.error { color: var(--danger); border-color: var(--danger); }
  .toast.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>🏋️ Rutinas Gym</h1>
  <p>Arma tus propias Rutinas y Recetas Fit👊</p>
</header>

<nav class="tabs">
  <button class="active" data-tab="plan" type="button">📅 Plan</button>
  <button data-tab="entrenar" type="button">🎯 Entrenar</button>
  <button data-tab="sesion" type="button">➕ Manual</button>
  <button data-tab="bloques" type="button">📦 Bloques</button>
  <button data-tab="comidas" type="button">🍳 Comidas</button>
</nav>

<main>

<div class="tab-panel" data-panel="bloques">
  <section class="card" id="card-bloques">
    <h2>Bloques <button class="secondary" id="toggle-bloque-form" type="button">+ Nuevo</button></h2>

    <form id="form-bloque" style="display:none; margin-bottom:0.75rem;">
      <label>Nombre</label>
      <input name="nombre" required maxlength="120" placeholder="Bloque 2 - Fuerza" />

      <div class="row">
        <div>
          <label>Foco</label>
          <select name="foco">
            <option value="potencia">Potencia</option>
            <option value="fuerza">Fuerza</option>
            <option value="hipertrofia_funcional">Hipertrofia funcional</option>
            <option value="deload">Deload</option>
          </select>
        </div>
        <div>
          <label>Fecha inicio</label>
          <input name="fechaInicio" type="date" required />
        </div>
        <div>
          <label>Semanas</label>
          <input name="duracionSemanas" type="number" min="1" max="52" value="5" required />
        </div>
      </div>

      <label>Notas (opcional)</label>
      <input name="notas" maxlength="255" />

      <div class="row" style="margin-top:0.75rem;">
        <button type="submit" class="primary">Crear bloque</button>
      </div>
    </form>

    <ul class="list" id="lista-bloques"><li class="empty">Cargando...</li></ul>
  </section>
</div>

<div class="tab-panel" data-panel="entrenar">
  <section class="card">
    <h2>¿Qué querés entrenar hoy?</h2>

    <label>Bloque</label>
    <select id="select-entrenar-bloque"></select>

    <label>Día</label>
    <select id="select-entrenar-dia">
      <option value="lunes">Lunes</option>
      <option value="martes">Martes</option>
      <option value="miercoles">Miércoles</option>
      <option value="jueves">Jueves</option>
      <option value="viernes">Viernes</option>
      <option value="sabado">Sábado</option>
      <option value="domingo">Domingo</option>
    </select>

    <div class="objetivos-grid" id="objetivos-grid"></div>
    <div id="objetivo-preview" style="display:none;"></div>
  </section>

  <section class="card" id="card-resultado-entrenar" style="display:none;">
    <h2>Sesión armada</h2>
    <div id="resultado-entrenar"></div>
  </section>
</div>

<div class="tab-panel" data-panel="sesion">
  <section class="card">
    <h2>Nueva sesión (manual)</h2>
    <form id="form-sesion">
      <label>Bloque</label>
      <select name="bloqueId" id="select-bloque" required></select>

      <div class="row">
        <div>
          <label>Día</label>
          <select name="diaSemana">
            <option value="lunes">Lunes</option>
            <option value="martes">Martes</option>
            <option value="miercoles">Miércoles</option>
            <option value="jueves">Jueves</option>
            <option value="viernes">Viernes</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
          </select>
        </div>
        <div>
          <label>Duración (min)</label>
          <input name="duracionEstimadaMin" type="number" value="40" min="10" max="180" />
        </div>
      </div>

      <label>Nombre de la sesión (opcional)</label>
      <input name="nombreSesion" maxlength="120" placeholder="Empuje + Potencia + Core" />

      <h3 style="font-size:0.85rem; margin: 1rem 0 0.5rem; color:var(--text-dim);">Fases</h3>
      <div id="fases-container"></div>
      <button type="button" class="secondary" id="add-fase">+ Agregar fase</button>

      <div class="row" style="margin-top:1rem;">
        <button type="submit" class="primary">Armar sesión</button>
      </div>
    </form>
  </section>

  <section class="card" id="card-resultado" style="display:none;">
    <h2>Sesión armada</h2>
    <div id="resultado"></div>
  </section>
</div>

<div class="tab-panel" data-panel="comidas">
  <section class="card" id="card-plan-comidas">
    <h2>
      Plan de comidas
      <button class="secondary" id="toggle-plan-comidas-form" type="button">🗓 Generar</button>
    </h2>

    <form id="form-plan-comidas" style="display:none; margin-bottom:0.75rem;">
      <label>Fecha de inicio (lunes de esa semana)</label>
      <input name="fechaInicio" type="date" required />

      <label>Días que entrenás (agrega un snack de recuperación post-entreno)</label>
      <div class="check-row" id="plan-dias-entreno-checks"></div>

      <label>Comidas a incluir</label>
      <div class="check-row" id="plan-tipos-checks"></div>

      <label>Objetivo (opcional, separado por coma: musculo, definicion, energia, recuperacion...)</label>
      <input name="objetivos" placeholder="definicion, musculo" />

      <label>No repetir una receta en los últimos (días)</label>
      <input name="ventanaDiasSinRepetir" type="number" min="0" max="90" value="21" />

      <div class="row" style="margin-top:0.75rem;">
        <button type="submit" class="primary">Generar plan</button>
        <button type="button" class="secondary" id="btn-cancelar-plan-comidas">Cancelar</button>
      </div>
    </form>

    <div class="row" id="plan-comidas-selector" style="display:none;">
      <div>
        <label>Plan generado</label>
        <select id="select-plan-comidas"></select>
      </div>
      <div style="flex:0; align-self:end;">
        <button type="button" class="danger" id="btn-borrar-plan-comidas" title="Borrar este plan">🗑</button>
      </div>
    </div>

    <div id="plan-comidas-semanal"></div>
  </section>

  <section class="card">
    <h2>
      Comidas fáciles y fit
      <span style="display:flex; gap:0.4rem;">
        <button class="secondary" id="toggle-bulk-recetas" type="button">⇪ Carga rápida</button>
        <button class="secondary" id="toggle-receta-form" type="button">+ Nueva</button>
      </span>
    </h2>

    <form id="form-receta" style="display:none; margin-bottom:0.75rem;">
      <label>Nombre</label>
      <input name="nombre" required maxlength="120" placeholder="Tostadas con palta y huevo" />

      <div class="row">
        <div>
          <label>Tipo</label>
          <select name="tipoComida">
            <option value="desayuno">Desayuno</option>
            <option value="snack">Snack</option>
            <option value="almuerzo">Almuerzo</option>
            <option value="merienda">Merienda</option>
            <option value="cena">Cena</option>
          </select>
        </div>
        <div>
          <label>Dificultad</label>
          <select name="dificultad">
            <option value="facil">Fácil</option>
            <option value="media">Media</option>
            <option value="elaborada">Elaborada</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Tiempo prep. (min)</label>
          <input name="tiempoPrepMin" type="number" min="1" max="600" value="10" required />
        </div>
        <div>
          <label>Porciones</label>
          <input name="porciones" type="number" min="1" max="20" value="1" required />
        </div>
        <div>
          <label>Calorías aprox.</label>
          <input name="caloriasAprox" type="number" min="0" />
        </div>
        <div>
          <label>Proteína aprox. (g)</label>
          <input name="proteinaAproxG" type="number" min="0" />
        </div>
      </div>

      <label>Ingredientes (uno por línea, ej: "Huevo - 2 unidades")</label>
      <textarea name="ingredientes" rows="4" required placeholder="Pan integral - 2 rebanadas&#10;Palta - 1/2 unidad&#10;Huevo - 1 unidad"></textarea>

      <label>Instrucciones</label>
      <textarea name="instrucciones" rows="3" required></textarea>

      <div class="row">
        <div>
          <label>Objetivos (separados por coma)</label>
          <input name="objetivos" placeholder="musculo, definicion" />
        </div>
        <div>
          <label>Tags (separados por coma)</label>
          <input name="tags" placeholder="pollo, rapido" />
        </div>
        <div>
          <label>Costo</label>
          <select name="costo">
            <option value="bajo">Bajo</option>
            <option value="medio" selected>Medio</option>
            <option value="alto">Alto</option>
          </select>
        </div>
      </div>

      <div class="check-row">
        <label class="check-chip"><input type="checkbox" name="vegetariana" /> Vegetariana</label>
        <label class="check-chip"><input type="checkbox" name="vegana" /> Vegana</label>
        <label class="check-chip"><input type="checkbox" name="sinGluten" /> Sin gluten</label>
        <label class="check-chip"><input type="checkbox" name="mealPrep" /> Meal prep</label>
      </div>

      <label>Notas (opcional)</label>
      <input name="notas" maxlength="255" />

      <div class="row" style="margin-top:0.75rem;">
        <button type="submit" class="primary" id="btn-guardar-receta">Crear receta</button>
        <button type="button" class="secondary" id="btn-cancelar-receta">Cancelar</button>
      </div>
    </form>

    <form id="form-bulk-recetas" style="display:none; margin-bottom:0.75rem;">
      <label>Pegá un array JSON de recetas (misma forma que el detalle de una receta, con "ingredientes": [{"nombre","cantidad"}])</label>
      <textarea name="json" rows="6" placeholder='[{"nombre":"...", "tipoComida":"desayuno", "tiempoPrepMin":10, "porciones":1, "dificultad":"facil", "instrucciones":"...", "ingredientes":[{"nombre":"Huevo","cantidad":"2 unidades"}]}]'></textarea>
      <div class="row" style="margin-top:0.75rem;">
        <button type="submit" class="primary">Importar</button>
        <button type="button" class="secondary" id="btn-cancelar-bulk">Cancelar</button>
      </div>
    </form>

    <div class="row">
      <div>
        <label>Tipo</label>
        <select id="filtro-tipo-comida">
          <option value="">Todas</option>
          <option value="desayuno">Desayuno</option>
          <option value="snack">Snack</option>
          <option value="almuerzo">Almuerzo</option>
          <option value="merienda">Merienda</option>
          <option value="cena">Cena</option>
        </select>
      </div>
      <div>
        <label>Tiempo máx.</label>
        <select id="filtro-tiempo-comida">
          <option value="">Cualquiera</option>
          <option value="10">10 min</option>
          <option value="15">15 min</option>
          <option value="20">20 min</option>
          <option value="30">30 min</option>
        </select>
      </div>
      <div>
        <label>Dificultad</label>
        <select id="filtro-dificultad-comida">
          <option value="">Cualquiera</option>
          <option value="facil">Fácil</option>
          <option value="media">Media</option>
        </select>
      </div>
    </div>

    <ul class="list" id="lista-recetas" style="margin-top:0.75rem;"><li class="empty">Cargando...</li></ul>
  </section>

  <section class="card" id="card-receta-detalle" style="display:none;">
    <h2 id="receta-detalle-titulo"></h2>
    <div id="receta-detalle-body"></div>
  </section>
</div>

<div class="tab-panel active" data-panel="plan">
  <section class="card">
    <h2>Plan semanal</h2>
    <label>Bloque</label>
    <select id="select-plan-bloque"></select>
    <div id="plan-semanal" style="margin-top:0.75rem;"></div>
  </section>
</div>

</main>

<div class="toast" id="toast"></div>

<script>
const DIAS = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
const DIAS_LABEL = { lunes: 'Lunes', martes: 'Martes', miercoles: 'Miércoles', jueves: 'Jueves', viernes: 'Viernes', sabado: 'Sábado', domingo: 'Domingo' };
const FASES = ['movilidad', 'activacion', 'potencia', 'fuerza', 'accesorios', 'core', 'finisher'];
const PATRONES = ['empuje', 'tiron', 'rodilla', 'cadera', 'core', 'rotacion', 'potencia', 'aceleracion', 'desaceleracion', 'estabilidad', 'movilidad'];
const METODOS = ['tradicional', 'superserie', 'circuito', 'emom', 'amrap', 'contraste', 'complejo'];

const $ = (sel) => document.querySelector(sel);
const toast = $('#toast');

function showToast(msg, isError) {
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function optionsHtml(values, labels) {
  return values.map((v, i) => `<option value="${v}">${labels ? labels[i] : v}</option>`).join('');
}

// ── Fases dinámicas ──────────────────────────────────

function crearFilaFase() {
  const div = document.createElement('div');
  div.className = 'fase-row';
  div.innerHTML = `
    <select class="fase-fase">${optionsHtml(FASES)}</select>
    <select class="fase-patron">${optionsHtml(PATRONES)}</select>
    <input class="fase-cantidad" type="number" min="1" max="6" value="1" />
    <select class="fase-metodo">${optionsHtml(METODOS)}</select>
    <button type="button" class="danger fase-quitar">✕</button>
  `;
  div.querySelector('.fase-quitar').addEventListener('click', () => div.remove());
  return div;
}

$('#add-fase').addEventListener('click', () => {
  $('#fases-container').appendChild(crearFilaFase());
});

// arranca con 2 fases por defecto
$('#fases-container').appendChild(crearFilaFase());
$('#fases-container').appendChild(crearFilaFase());

// ── Bloques ──────────────────────────────────────────

$('#toggle-bloque-form').addEventListener('click', () => {
  const form = $('#form-bloque');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});

$('#lista-bloques').addEventListener('click', async (e) => {
  const btn = e.target.closest('.btn-borrar-sesion');
  if (!btn) return;

  if (!confirm('¿Borrar este bloque y todas sus sesiones?')) return;

  try {
    await api(`/bloques/${btn.dataset.bloqueId}`, { method: 'DELETE' });
    showToast('Bloque borrado');
    await cargarBloques();
    if (bloqueActualPlan) await cargarPlan($('#select-plan-bloque').value);
  } catch (err) {
    showToast(err.message, true);
  }
});

let bloquesCache = [];

async function cargarBloques() {
  const bloques = await api('/bloques');
  bloquesCache = bloques;
  const lista = $('#lista-bloques');
  const select = $('#select-bloque');
  const selectPlan = $('#select-plan-bloque');

  lista.innerHTML = bloques.length
    ? bloques.map(b => `
      <li class="item">
        <div>
          <strong>${b.nombre}</strong>
          <span class="meta">${b.foco} · ${b.fecha_inicio} → ${b.fecha_fin} (${b.duracion_semanas} sem)</span>
        </div>
        <span class="sesion-info">
          <span class="badge">#${b.id}</span>
          <button type="button" class="btn-borrar-sesion" data-bloque-id="${b.id}" title="Borrar bloque">🗑</button>
        </span>
      </li>`).join('')
    : '<li class="empty">Todavía no hay bloques. Creá uno con "+ Nuevo".</li>';

  const bloquesAsc = [...bloques].sort((a, b) => a.id - b.id);
  const opciones = bloquesAsc.map(b => `<option value="${b.id}">#${b.id} · ${b.nombre}</option>`).join('');
  select.innerHTML = opciones;

  const selectEntrenar = $('#select-entrenar-bloque');
  const valorPrevioEntrenar = selectEntrenar.value;
  selectEntrenar.innerHTML = opciones;
  if (valorPrevioEntrenar && bloques.some(b => String(b.id) === valorPrevioEntrenar)) {
    selectEntrenar.value = valorPrevioEntrenar;
  }

  const valorPrevio = selectPlan.value;
  selectPlan.innerHTML = opciones;
  if (valorPrevio && bloques.some(b => String(b.id) === valorPrevio)) {
    selectPlan.value = valorPrevio;
  }
}

$('#form-bloque').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await api('/bloques', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: fd.get('nombre'),
        foco: fd.get('foco'),
        fechaInicio: fd.get('fechaInicio'),
        duracionSemanas: Number(fd.get('duracionSemanas')),
        notas: fd.get('notas') || undefined,
      }),
    });
    showToast('Bloque creado');
    e.target.reset();
    e.target.style.display = 'none';
    await cargarBloques();
  } catch (err) {
    showToast(err.message, true);
  }
});

// ── Nueva sesión ─────────────────────────────────────

$('#form-sesion').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);

  const fases = [...document.querySelectorAll('.fase-row')].map(row => ({
    fase: row.querySelector('.fase-fase').value,
    patron: row.querySelector('.fase-patron').value,
    cantidad: Number(row.querySelector('.fase-cantidad').value),
    metodo: row.querySelector('.fase-metodo').value,
  }));

  if (fases.length === 0) {
    showToast('Agregá al menos una fase', true);
    return;
  }

  const bloqueId = Number(fd.get('bloqueId'));

  const btnSubmit = e.target.querySelector('button[type="submit"]');
  btnSubmit.disabled = true;
  try {
    const { sesionId } = await api('/sesiones', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bloqueId,
        diaSemana: fd.get('diaSemana'),
        nombreSesion: fd.get('nombreSesion') || undefined,
        duracionEstimadaMin: Number(fd.get('duracionEstimadaMin')),
        fases,
      }),
    });
    showToast(`Sesión #${sesionId} armada`);
    await mostrarSesion(sesionId);
    $('#select-plan-bloque').value = bloqueId;
    await cargarPlan(bloqueId);
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btnSubmit.disabled = false;
  }
});

// ── Resultado / detalle de sesión ───────────────────

let sesionActualResultado = null;

async function mostrarSesion(id) {
  sesionActualResultado = id;
  const sesion = await api(`/sesiones/${id}`);
  const card = $('#card-resultado');
  card.style.display = 'block';

  $('#resultado').innerHTML = `
    <p><strong>${sesion.nombre || '(sin nombre)'}</strong>
       <span class="badge">${sesion.dia_semana}</span>
       <span class="badge">${sesion.duracion_estimada_min} min</span></p>
    ${tablaEjercicios(sesion.ejercicios)}
  `;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Plan semanal (ejercicios agrupados por día) ──────

let ejerciciosPorPatron = new Map();

async function cargarCatalogoEjercicios() {
  const ejercicios = await api('/ejercicios');
  ejerciciosPorPatron = new Map();
  for (const e of ejercicios) {
    const lista = ejerciciosPorPatron.get(e.patron_movimiento) ?? [];
    lista.push(e);
    ejerciciosPorPatron.set(e.patron_movimiento, lista);
  }
}

function selectorEjercicio(ej) {
  const opciones = ejerciciosPorPatron.get(ej.patron_movimiento) ?? [];
  return `
    <select class="swap-ejercicio" data-se-id="${ej.sesion_ejercicio_id}">
      ${opciones.map(o => `<option value="${o.id}" ${o.id === ej.ejercicio_id ? 'selected' : ''}>${o.nombre}</option>`).join('')}
    </select>
  `;
}

const FASE_LABEL = {
  movilidad: 'Movilidad',
  activacion: 'Activación',
  potencia: 'Potencia',
  fuerza: 'Fuerza',
  accesorios: 'Accesorios',
  core: 'Core',
  finisher: 'Finisher',
};

function tablaEjercicios(ejercicios) {
  // Agrupa filas consecutivas de la misma fase bajo una sola celda (rowspan)
  // para que se lea como bloques ordenados en vez de una lista plana.
  const filas = [];
  let i = 0;
  while (i < ejercicios.length) {
    let j = i;
    while (j < ejercicios.length && ejercicios[j].fase === ejercicios[i].fase) j++;
    const span = j - i;
    for (let k = i; k < j; k++) {
      filas.push({
        ej: ejercicios[k],
        faseCell: k === i
          ? `<td class="fase-cell" rowspan="${span}">${FASE_LABEL[ejercicios[k].fase] ?? ejercicios[k].fase}</td>`
          : '',
      });
    }
    i = j;
  }

  return `
    <table>
      <tbody>
        ${filas.map(({ ej, faseCell }) => `
          <tr>
            ${faseCell}
            <td>
              ${selectorEjercicio(ej)}
              ${ej.notas ? `<div class="ej-desc">${ej.notas}</div>` : ''}
            </td>
            <td>
              ${ej.metodo}${ej.video_url ? ` · <a href="${ej.video_url}" target="_blank" rel="noopener">🎥</a>` : ''}
              ${ej.series || ej.reps ? `<div class="ej-desc">${[ej.series ? `${ej.series}x${ej.reps ?? ''}` : ej.reps, ej.descanso_seg ? `desc ${ej.descanso_seg}s` : ''].filter(Boolean).join(' · ')}</div>` : ''}
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}

let bloqueActualPlan = null;

document.addEventListener('change', async (e) => {
  const select = e.target.closest('.swap-ejercicio');
  if (!select) return;

  const seId = select.dataset.seId;
  const ejercicioId = Number(select.value);

  try {
    await api(`/sesion-ejercicios/${seId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ejercicioId }),
    });
    showToast('Ejercicio actualizado');
    if (bloqueActualPlan) await cargarPlan(bloqueActualPlan);
    if (sesionActualResultado) await mostrarSesion(sesionActualResultado);
    if (sesionActualEntrenar) await mostrarResultadoEntrenar(sesionActualEntrenar);
  } catch (err) {
    showToast(err.message, true);
  }
});

async function cargarPlan(bloqueId) {
  bloqueActualPlan = bloqueId;
  const contenedor = $('#plan-semanal');
  if (!bloqueId) {
    contenedor.innerHTML = '<p class="empty">Creá un bloque para ver su plan semanal.</p>';
    return;
  }

  const sesiones = await api(`/sesiones?bloqueId=${bloqueId}`);
  const porDia = new Map();
  for (const s of sesiones) {
    const lista = porDia.get(s.dia_semana) ?? [];
    lista.push(s);
    porDia.set(s.dia_semana, lista);
  }

  contenedor.innerHTML = DIAS.map(dia => {
    const sesionesDelDia = porDia.get(dia) ?? [];
    if (sesionesDelDia.length === 0) {
      return `
        <div class="dia-block">
          <div class="dia-header"><span>${DIAS_LABEL[dia]}</span></div>
          <div class="dia-descanso">Descanso / sin sesión</div>
        </div>`;
    }
    return sesionesDelDia.map(s => `
      <div class="dia-block">
        <div class="dia-header">
          <span>${DIAS_LABEL[dia]}</span>
          <span class="sesion-info">
            <span class="sesion-nombre">${s.nombre || '(sin nombre)'} · ${s.duracion_estimada_min} min</span>
            <button type="button" class="btn-borrar-sesion" data-sesion-id="${s.id}" title="Borrar sesión">🗑</button>
          </span>
        </div>
        ${s.ejercicios.length ? tablaEjercicios(s.ejercicios) : '<div class="dia-descanso">Sin ejercicios cargados</div>'}
      </div>`).join('');
  }).join('');
}

$('#select-plan-bloque').addEventListener('change', (e) => cargarPlan(e.target.value));

$('#plan-semanal').addEventListener('click', async (e) => {
  const btn = e.target.closest('.btn-borrar-sesion');
  if (!btn) return;

  if (!confirm('¿Borrar esta sesión y sus ejercicios?')) return;

  try {
    await api(`/sesiones/${btn.dataset.sesionId}`, { method: 'DELETE' });
    showToast('Sesión borrada');
    if (bloqueActualPlan) await cargarPlan(bloqueActualPlan);
  } catch (err) {
    showToast(err.message, true);
  }
});

let objetivoSeleccionado = null;

function renderObjetivos() {
  const grid = $('#objetivos-grid');
  grid.innerHTML = Object.entries(OBJETIVOS).map(([key, o]) => `
    <button type="button" class="objetivo-btn" data-key="${key}">
      <span class="objetivo-emoji">${o.emoji}</span>
      <span class="objetivo-label">${o.label}</span>
      <span class="objetivo-sub">${o.subtitulo}</span>
    </button>
  `).join('');

  grid.querySelectorAll('.objetivo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.objetivo-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      objetivoSeleccionado = btn.dataset.key;
      mostrarPreviewObjetivo(objetivoSeleccionado);
    });
  });
}

function mostrarPreviewObjetivo(key) {
  const o = OBJETIVOS[key];
  const preview = $('#objetivo-preview');
  preview.style.display = 'block';
  preview.innerHTML = `
    <p style="font-size:0.8rem; color:var(--text-dim); margin-top:0.75rem;">
      ⏱ ${o.duracion} min · ${o.fases.map(f => FASE_LABEL[f.fase] ?? f.fase).join(' → ')}
    </p>
    <button type="button" class="primary" id="btn-generar-rapida">Generar sesión</button>
  `;
  $('#btn-generar-rapida').addEventListener('click', generarSesionRapida);
}

let sesionActualEntrenar = null;

async function generarSesionRapida() {
  const o = OBJETIVOS[objetivoSeleccionado];
  const bloqueId = Number($('#select-entrenar-bloque').value);
  const diaSemana = $('#select-entrenar-dia').value;

  if (!bloqueId) {
    showToast('Creá un bloque primero (pestaña Bloques)', true);
    return;
  }

  const btnGenerar = $('#btn-generar-rapida');
  btnGenerar.disabled = true;
  try {
    const { sesionId } = await api('/sesiones', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bloqueId,
        diaSemana,
        nombreSesion: `${o.emoji} ${o.label}`,
        duracionEstimadaMin: o.duracion,
        fases: o.fases,
      }),
    });

    sesionActualEntrenar = sesionId;
    await mostrarResultadoEntrenar(sesionId);
    showToast('¡Sesión armada!');
    $('#select-plan-bloque').value = bloqueId;
    await cargarPlan(bloqueId);
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btnGenerar.disabled = false;
  }
}

async function mostrarResultadoEntrenar(id) {
  const sesion = await api(`/sesiones/${id}`);
  $('#card-resultado-entrenar').style.display = 'block';
  $('#resultado-entrenar').innerHTML = `

       <span class="badge">${sesion.duracion_estimada_min} min</span></p>
    ${tablaEjercicios(sesion.ejercicios)}
  `;

// ── Comidas ──────────────────────────────────────────

const TIPO_COMIDA_LABEL = { desayuno: 'Desayuno', snack: 'Snack', almuerzo: 'Almuerzo', merienda: 'Merienda', cena: 'Cena' };
const DIFICULTAD_LABEL = { facil: 'Fácil', media: 'Media' };

function claseTiempo(min) {
  if (min <= 10) return 'badge-tiempo-rapido';
  if (min <= 20) return 'badge-tiempo-medio';
  return 'badge-tiempo-lento';
}

function cerrarRecetaDetalle() {
  $('#card-receta-detalle').style.display = 'none';
  $('#receta-detalle-body').innerHTML = '';
}

async function cargarRecetas() {
  const params = new URLSearchParams();
  const tipo = $('#filtro-tipo-comida').value;
  const tiempoMax = $('#filtro-tiempo-comida').value;
  const dificultad = $('#filtro-dificultad-comida').value;
  if (tipo) params.set('tipo', tipo);
  if (tiempoMax) params.set('tiempoMax', tiempoMax);
  if (dificultad) params.set('dificultad', dificultad);

  cerrarRecetaDetalle();

  const lista = $('#lista-recetas');
  lista.innerHTML = '<li class="empty">Cargando...</li>';
  try {
    const recetas = await api(`/recetas?${params.toString()}`);
    lista.innerHTML = recetas.length
      ? recetas.map(r => `
        <li class="item" data-receta-id="${r.id}" data-tipo="${r.tipo_comida}">
          <div>
            <strong>${r.nombre}</strong>
            <span class="meta">
              <span class="badge badge-tipo-${r.tipo_comida}">${TIPO_COMIDA_LABEL[r.tipo_comida] ?? r.tipo_comida}</span>
              <span class="badge badge-dificultad-${r.dificultad}">${DIFICULTAD_LABEL[r.dificultad] ?? r.dificultad}</span>
            </span>
          </div>
          <span class="sesion-info">
            <span class="badge ${claseTiempo(r.tiempo_prep_min)}">⏱ ${r.tiempo_prep_min} min</span>
            ${r.calorias_aprox ? `<span class="badge">${r.calorias_aprox} kcal</span>` : ''}
            <button type="button" class="btn-icon btn-editar-receta" data-receta-id="${r.id}" title="Editar">✎</button>
            <button type="button" class="btn-icon btn-icon-danger btn-borrar-receta" data-receta-id="${r.id}" title="Borrar">🗑</button>
          </span>
        </li>`).join('')
      : '<li class="empty">No hay recetas con esos filtros.</li>';
  } catch (err) {
    showToast(err.message, true);
  }
}

async function mostrarRecetaDetalle(id) {
  try {
    const receta = await api(`/recetas/${id}`);
    const card = $('#card-receta-detalle');
    card.style.display = 'block';
    $('#receta-detalle-titulo').textContent = receta.nombre;
    $('#receta-detalle-body').innerHTML = `
      ${receta.descripcion ? `<p style="font-size:0.85rem; color:var(--text-dim); margin-top:-0.25rem;">${receta.descripcion}</p>` : ''}
      <p>
        <span class="badge badge-tipo-${receta.tipo_comida}">${TIPO_COMIDA_LABEL[receta.tipo_comida] ?? receta.tipo_comida}</span>
        <span class="badge ${claseTiempo(receta.tiempo_prep_min)}">⏱ ${receta.tiempo_prep_min} min</span>
        <span class="badge badge-dificultad-${receta.dificultad}">${DIFICULTAD_LABEL[receta.dificultad] ?? receta.dificultad}</span>
        ${receta.calorias_aprox ? `<span class="badge">${receta.calorias_aprox} kcal</span>` : ''}
        ${receta.proteina_aprox_g ? `<span class="badge">${receta.proteina_aprox_g} g prot</span>` : ''}
        <span class="badge">${receta.porciones} porción${receta.porciones > 1 ? 'es' : ''}</span>
        ${receta.vegana ? `<span class="badge badge-dificultad-facil">Vegana</span>` : receta.vegetariana ? `<span class="badge badge-dificultad-facil">Vegetariana</span>` : ''}
        ${receta.sin_gluten ? `<span class="badge">Sin gluten</span>` : ''}
        ${receta.meal_prep ? `<span class="badge">Meal prep</span>` : ''}
      </p>
      ${(receta.objetivos?.length || receta.tags?.length) ? `
        <p style="margin-top:-0.5rem;">
          ${(receta.objetivos ?? []).map(o => `<span class="badge badge-tipo-almuerzo">${o}</span>`).join('')}
          ${(receta.tags ?? []).map(t => `<span class="badge">${t}</span>`).join('')}
        </p>` : ''}
      <h3 style="font-size:0.85rem; margin: 1rem 0 0.5rem; color:var(--text-dim);">Ingredientes</h3>
      <ul class="list">
        ${receta.ingredientes.map(i => `
          <li class="item">
            <span>${i.nombre}</span>
            <span class="meta">${i.cantidad || ''}</span>
          </li>`).join('')}
      </ul>
      <h3 style="font-size:0.85rem; margin: 1rem 0 0.5rem; color:var(--text-dim);">Preparación</h3>
      <p style="font-size:0.85rem; line-height:1.5;">${receta.instrucciones}</p>
      ${receta.notas ? `<p class="empty">${receta.notas}</p>` : ''}
    `;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    showToast(err.message, true);
  }
}

function parseIngredientesTexto(texto) {
  return texto.split('\n').map(l => l.trim()).filter(Boolean).map(linea => {
    const idx = linea.indexOf(' - ');
    if (idx === -1) return { nombre: linea };
    return { nombre: linea.slice(0, idx).trim(), cantidad: linea.slice(idx + 3).trim() || undefined };
  });
}

function ingredientesATexto(ingredientes) {
  return ingredientes.map(i => (i.cantidad ? `${i.nombre} - ${i.cantidad}` : i.nombre)).join('\n');
}

let editandoRecetaId = null;

function abrirFormReceta() {
  $('#form-bulk-recetas').style.display = 'none';
  $('#form-receta').style.display = 'block';
}

function cerrarFormReceta() {
  $('#form-receta').style.display = 'none';
  $('#form-receta').reset();
  editandoRecetaId = null;
  $('#btn-guardar-receta').textContent = 'Crear receta';
}

$('#toggle-receta-form').addEventListener('click', () => {
  if ($('#form-receta').style.display === 'none') {
    editandoRecetaId = null;
    $('#form-receta').reset();
    $('#btn-guardar-receta').textContent = 'Crear receta';
    abrirFormReceta();
  } else {
    cerrarFormReceta();
  }
});

$('#btn-cancelar-receta').addEventListener('click', cerrarFormReceta);

async function editarReceta(id) {
  try {
    const receta = await api(`/recetas/${id}`);
    const form = $('#form-receta');
    form.nombre.value = receta.nombre;
    form.tipoComida.value = receta.tipo_comida;
    form.dificultad.value = receta.dificultad;
    form.tiempoPrepMin.value = receta.tiempo_prep_min;
    form.porciones.value = receta.porciones;
    form.caloriasAprox.value = receta.calorias_aprox ?? '';
    form.proteinaAproxG.value = receta.proteina_aprox_g ?? '';
    form.instrucciones.value = receta.instrucciones;
    form.notas.value = receta.notas ?? '';
    form.ingredientes.value = ingredientesATexto(receta.ingredientes);
    form.objetivos.value = (receta.objetivos ?? []).join(', ');
    form.tags.value = (receta.tags ?? []).join(', ');
    form.costo.value = receta.costo ?? 'medio';
    form.vegetariana.checked = !!receta.vegetariana;
    form.vegana.checked = !!receta.vegana;
    form.sinGluten.checked = !!receta.sin_gluten;
    form.mealPrep.checked = !!receta.meal_prep;
    editandoRecetaId = id;
    $('#btn-guardar-receta').textContent = 'Guardar cambios';
    abrirFormReceta();
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    showToast(err.message, true);
  }
}

$('#form-receta').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const ingredientes = parseIngredientesTexto(fd.get('ingredientes'));
  if (!ingredientes.length) {
    showToast('Agregá al menos un ingrediente', true);
    return;
  }
  const body = {
    nombre: fd.get('nombre'),
    tipoComida: fd.get('tipoComida'),
    dificultad: fd.get('dificultad'),
    tiempoPrepMin: Number(fd.get('tiempoPrepMin')),
    porciones: Number(fd.get('porciones')),
    caloriasAprox: fd.get('caloriasAprox') ? Number(fd.get('caloriasAprox')) : undefined,
    proteinaAproxG: fd.get('proteinaAproxG') ? Number(fd.get('proteinaAproxG')) : undefined,
    instrucciones: fd.get('instrucciones'),
    notas: fd.get('notas') || undefined,
    ingredientes,
    objetivos: (fd.get('objetivos') || '').split(',').map(o => o.trim()).filter(Boolean),
    tags: (fd.get('tags') || '').split(',').map(t => t.trim()).filter(Boolean),
    costo: fd.get('costo'),
    vegetariana: fd.get('vegetariana') === 'on',
    vegana: fd.get('vegana') === 'on',
    sinGluten: fd.get('sinGluten') === 'on',
    mealPrep: fd.get('mealPrep') === 'on',
  };
  try {
    if (editandoRecetaId) {
      await api(`/recetas/${editandoRecetaId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      showToast('Receta actualizada');
    } else {
      await api('/recetas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      showToast('Receta creada');
    }
    cerrarFormReceta();
    await cargarRecetas();
  } catch (err) {
    showToast(err.message, true);
  }
});

$('#toggle-bulk-recetas').addEventListener('click', () => {
  const form = $('#form-bulk-recetas');
  if (form.style.display === 'none') {
    cerrarFormReceta();
    form.style.display = 'block';
  } else {
    form.style.display = 'none';
  }
});

$('#btn-cancelar-bulk').addEventListener('click', () => {
  $('#form-bulk-recetas').style.display = 'none';
  $('#form-bulk-recetas').reset();
});

$('#form-bulk-recetas').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  let items;
  try {
    items = JSON.parse(fd.get('json'));
    if (!Array.isArray(items)) throw new Error('Tiene que ser un array de recetas');
  } catch (err) {
    showToast(`JSON inválido: ${err.message}`, true);
    return;
  }
  try {
    const resultado = await api('/recetas/bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items),
    });
    showToast(`Importadas ${resultado.creadas}${resultado.omitidas ? `, omitidas ${resultado.omitidas} (nombre duplicado)` : ''}`);
    e.target.reset();
    e.target.style.display = 'none';
    await cargarRecetas();
  } catch (err) {
    showToast(err.message, true);
  }
});

$('#lista-recetas').addEventListener('click', async (e) => {
  const btnBorrar = e.target.closest('.btn-borrar-receta');
  if (btnBorrar) {
    if (!confirm('¿Borrar esta receta?')) return;
    try {
      await api(`/recetas/${btnBorrar.dataset.recetaId}`, { method: 'DELETE' });
      showToast('Receta borrada');
      await cargarRecetas();
    } catch (err) {
      showToast(err.message, true);
    }
    return;
  }

  const btnEditar = e.target.closest('.btn-editar-receta');
  if (btnEditar) {
    editarReceta(btnEditar.dataset.recetaId);
    return;
  }

  const item = e.target.closest('.item');
  if (!item) return;
  mostrarRecetaDetalle(item.dataset.recetaId);
});

$('#filtro-tipo-comida').addEventListener('change', cargarRecetas);
$('#filtro-tiempo-comida').addEventListener('change', cargarRecetas);
$('#filtro-dificultad-comida').addEventListener('change', cargarRecetas);

// ── Plan de comidas (selector automático, no inventa recetas) ────

const TIPOS_COMIDA_PLAN = ['desayuno', 'snack', 'almuerzo', 'merienda', 'cena'];

function renderChecks(contenedorId, valores, labels, todosMarcados) {
  $(`#${contenedorId}`).innerHTML = valores.map(v => `
    <label class="check-chip">
      <input type="checkbox" value="${v}" ${todosMarcados ? 'checked' : ''} />
      ${labels ? labels[v] : v}
    </label>
  `).join('');
}

function checksMarcados(contenedorId) {
  return [...document.querySelectorAll(`#${contenedorId} input:checked`)].map(i => i.value);
}

renderChecks('plan-dias-entreno-checks', DIAS, DIAS_LABEL, false);
renderChecks('plan-tipos-checks', TIPOS_COMIDA_PLAN, TIPO_COMIDA_LABEL, true);

$('#toggle-plan-comidas-form').addEventListener('click', () => {
  const form = $('#form-plan-comidas');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});

$('#btn-cancelar-plan-comidas').addEventListener('click', () => {
  $('#form-plan-comidas').style.display = 'none';
});

let planComidaActual = null;

async function cargarPlanesComida() {
  const planes = await api('/planes-comida');
  const select = $('#select-plan-comidas');
  const selector = $('#plan-comidas-selector');

  if (!planes.length) {
    selector.style.display = 'none';
    $('#plan-comidas-semanal').innerHTML = '<p class="empty">Todavía no generaste ningún plan de comidas.</p>';
    return;
  }
  selector.style.display = 'flex';
  select.innerHTML = planes.map(p => `<option value="${p.id}">#${p.id} · semana del ${p.fecha_inicio.slice(0, 10)}</option>`).join('');
  await mostrarPlanComida(select.value);
}

async function mostrarPlanComida(planId) {
  if (!planId) return;
  planComidaActual = Number(planId);
  const plan = await api(`/planes-comida/${planId}`);
  const porDia = new Map();
  for (const c of plan.comidas) {
    const lista = porDia.get(c.dia_semana) ?? [];
    lista.push(c);
    porDia.set(c.dia_semana, lista);
  }

  $('#plan-comidas-semanal').innerHTML = DIAS.map(dia => {
    const comidasDelDia = porDia.get(dia) ?? [];
    if (!comidasDelDia.length) {
      return `
        <div class="dia-block">
          <div class="dia-header"><span>${DIAS_LABEL[dia]}</span></div>
          <div class="dia-descanso">Sin comidas planificadas</div>
        </div>`;
    }
    return `
      <div class="dia-block">
        <div class="dia-header"><span>${DIAS_LABEL[dia]}</span></div>
        <ul class="list" style="padding: 0.5rem 0.75rem;">
          ${comidasDelDia.map(c => `
            <li class="item" data-receta-id="${c.receta_id}" data-tipo="${c.tipo_comida}">
              <div>
                <strong>${c.nombre}</strong>
                <span class="meta"><span class="badge badge-tipo-${c.tipo_comida}">${TIPO_COMIDA_LABEL[c.tipo_comida] ?? c.tipo_comida}</span></span>
              </div>
              <span class="sesion-info">
                <span class="badge ${claseTiempo(c.tiempo_prep_min)}">⏱ ${c.tiempo_prep_min} min</span>
                ${c.calorias_aprox ? `<span class="badge">${c.calorias_aprox} kcal</span>` : ''}
              </span>
            </li>`).join('')}
        </ul>
      </div>`;
  }).join('');
}

$('#form-plan-comidas').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const diasEntreno = checksMarcados('plan-dias-entreno-checks');
  const comidas = checksMarcados('plan-tipos-checks');
  if (!comidas.length) {
    showToast('Elegí al menos una comida', true);
    return;
  }
  const objetivos = (fd.get('objetivos') || '').split(',').map(o => o.trim()).filter(Boolean);

  try {
    const resultado = await api('/planes-comida', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fechaInicio: fd.get('fechaInicio'),
        dias: DIAS,
        comidas,
        objetivos,
        diasEntreno,
        ventanaDiasSinRepetir: Number(fd.get('ventanaDiasSinRepetir')) || 21,
      }),
    });
    showToast(resultado.sinAsignar.length
      ? `Plan generado, pero faltaron ${resultado.sinAsignar.length} comidas (todavía no hay recetas suficientes para eso)`
      : 'Plan generado');
    $('#form-plan-comidas').style.display = 'none';
    await cargarPlanesComida();
    $('#select-plan-comidas').value = resultado.planId;
    await mostrarPlanComida(resultado.planId);
  } catch (err) {
    showToast(err.message, true);
  }
});

$('#select-plan-comidas').addEventListener('change', (e) => mostrarPlanComida(e.target.value));

$('#btn-borrar-plan-comidas').addEventListener('click', async () => {
  if (!planComidaActual) return;
  if (!confirm('¿Borrar este plan de comidas?')) return;
  try {
    await api(`/planes-comida/${planComidaActual}`, { method: 'DELETE' });
    showToast('Plan borrado');
    planComidaActual = null;
    await cargarPlanesComida();
  } catch (err) {
    showToast(err.message, true);
  }
});

$('#plan-comidas-semanal').addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (!item) return;
  mostrarRecetaDetalle(item.dataset.recetaId);
});

// ── Tabs ─────────────────────────────────────────────

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).classList.add('active');
  });
});

// ── Init ─────────────────────────────────────────────

const DIA_POR_JS_DAY = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
$('#select-entrenar-dia').value = DIA_POR_JS_DAY[new Date().getDay()];

const hoy = new Date();
const diasHastaLunes = (8 - hoy.getDay()) % 7 || 7;
const proximoLunes = new Date(hoy);
proximoLunes.setDate(hoy.getDate() + diasHastaLunes);
$('#form-plan-comidas [name="fechaInicio"]').value = proximoLunes.toISOString().slice(0, 10);

(async function init() {
  try {
    renderObjetivos();
    await cargarCatalogoEjercicios();
    await cargarBloques();
    await cargarRecetas();
    await cargarPlanesComida();
    if (bloquesCache.length) {
      const primerBloqueId = Math.min(...bloquesCache.map(b => b.id));
      $('#select-plan-bloque').value = primerBloqueId;
    }
    await cargarPlan($('#select-plan-bloque').value);
  } catch (err) {
    showToast(err.message, true);
  }
})();
</script>
